# 打包安装包：Windows 必须在 windows-latest（better-sqlite3 无法从 macOS 交叉编译）。
# 触发：手动 workflow_dispatch，或推送版本标签（如 26.4.2 / v26.4.2）。
name: Package

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 打包目标
        required: true
        default: all
        type: choice
        options:
          - all
          - win
          - mac
  push:
    tags:
      - 'v*.*.*'
      - '*.*.*'

permissions:
  contents: write

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

env:
  # 未配置签名证书时跳过自动发现，避免 CI 因找不到证书失败
  CSC_IDENTITY_AUTO_DISCOVERY: false

jobs:
  win:
    name: Windows NSIS
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.platforms == 'all' ||
      github.event.inputs.platforms == 'win'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: 阅微-windows
          path: |
            dist/*.exe
            dist/*.yml
          if-no-files-found: error
          retention-days: 14

  mac:
    name: macOS DMG
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.platforms == 'all' ||
      github.event.inputs.platforms == 'mac'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS DMGs
        run: npm run dist:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 阅微-macos
          path: |
            dist/*.dmg
            dist/*.blockmap
            dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach to GitHub Release
    needs: [win, mac]
    # 仅标签推送时挂到 Release；手动跑只上传 artifact
    if: >-
      always() &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/') &&
      (needs.win.result == 'success' || needs.mac.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: 阅微-*
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
