# 打包安装包：Windows 必须在 windows-latest（better-sqlite3 无法从 macOS 交叉编译）。
# 触发：手动 workflow_dispatch，或推送版本标签（如 26.4.2 / v26.4.2）。
name: Package

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 打包目标
        required: true
        default: all
        type: choice
        options:
          - all
          - win
          - mac
  push:
    tags:
      - 'v*.*.*'
      - '*.*.*'

permissions:
  contents: write

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

env:
  # 未配置签名证书时跳过自动发现，避免 CI 因找不到证书失败
  CSC_IDENTITY_AUTO_DISCOVERY: false

jobs:
  win:
    name: Windows NSIS
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.platforms == 'all' ||
      github.event.inputs.platforms == 'win'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # 打包版本以 tag 为准：否则 electron-builder 读的是 package.json 里的旧版本号，
      # 推 26.4.3 的 tag 却产出 26.4.2 的安装包。手动触发时仍用 package.json 的版本。
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "使用 tag 版本: $VERSION"
          node -e '
            const fs = require("fs")
            const v = process.argv[1]
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"))
            pkg.version = v
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n")
            const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"))
            lock.version = v
            if (lock.packages && lock.packages[""]) lock.packages[""].version = v
            fs.writeFileSync("package-lock.json", JSON.stringify(lock, null, 2) + "\n")
          ' "$VERSION"

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --publish never：有 git tag 时 electron-builder 会默认想发 GitHub Release，
      # 缺 GH_TOKEN 会把已打好的安装包判失败；Release 交给下面的 release job。
      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: 阅微-windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.yml
          if-no-files-found: error
          retention-days: 14

  mac:
    name: macOS DMG
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.platforms == 'all' ||
      github.event.inputs.platforms == 'mac'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # 打包版本以 tag 为准：否则 electron-builder 读的是 package.json 里的旧版本号，
      # 推 26.4.3 的 tag 却产出 26.4.2 的安装包。手动触发时仍用 package.json 的版本。
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "使用 tag 版本: $VERSION"
          node -e '
            const fs = require("fs")
            const v = process.argv[1]
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"))
            pkg.version = v
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n")
            const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"))
            lock.version = v
            if (lock.packages && lock.packages[""]) lock.packages[""].version = v
            fs.writeFileSync("package-lock.json", JSON.stringify(lock, null, 2) + "\n")
          ' "$VERSION"

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS DMGs
        run: npm run dist:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 阅微-macos
          path: |
            dist/*.dmg
            dist/*.blockmap
            dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach to GitHub Release
    needs: [win, mac]
    # 仅标签推送时挂到 Release；手动跑只上传 artifact
    if: >-
      always() &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/') &&
      (needs.win.result == 'success' || needs.mac.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: 阅微-*
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
