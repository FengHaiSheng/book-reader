appId: com.bookread.app
productName: 阅微
copyright: Copyright © 2026

directories:
  output: dist
  buildResources: build

# 只打构建产物与 package.json；生产依赖的 node_modules 由 electron-builder 单独收集
files:
  - out/**/*
  - package.json

asar: true

# better-sqlite3 的 .node 与抽取 worker 都不能留在 asar 里：
# 前者是原生二进制（dlopen 不认识 asar 虚拟路径），后者要被 worker_threads 加载。
# pdfjs-dist 必须一起解包：pdf-worker 在 unpacked 目录里按 Node 规则找 node_modules，
# 只解包 worker 的话会解析不到 asar 里的依赖。
asarUnpack:
  - '**/*.node'
  - out/main/epub-worker.js
  - out/main/pdf-worker.js
  - out/main/kindle-worker.js
  - node_modules/pdfjs-dist/**
  # node-unrar-js 在运行时用 __dirname 定位 unrar.wasm，解包后按普通文件读最稳
  - node_modules/node-unrar-js/**

mac:
  category: public.app-category.books
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # 有 Apple Developer 账号后改成 true，并设好 APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID
  notarize: false

dmg:
  title: 阅微 ${version}

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true